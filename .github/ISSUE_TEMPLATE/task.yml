name: Task
description: A scoped change with acceptance criteria and verification
title: ""
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal / problem
      description: What should change and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable result"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests, manual checks, compatibility and operational risks.
    validations:
      required: true
